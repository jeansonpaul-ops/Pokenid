<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>body{margin:0}img{max-width:100%}</style></head><body>
<title>PokéNid</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Lexend:wght@400;500;700&family=Pixelify+Sans:wght@500;700&family=VT323&display=swap">
<style>
/* Mise en page : un jouet en plastique posé sur son carton d'emballage imprimé, la notice à côté.
   La coque prend la couleur du type du compagnon ; tout le reste en découle. */
:root{
  color-scheme:light;
  --shell:#2fb3a6;
  --shell-hi:color-mix(in oklab,var(--shell) 72%,#fff);
  --shell-lo:color-mix(in oklab,var(--shell) 72%,#10141f);
  --ground:color-mix(in oklab,var(--shell) 34%,#eef3f8);
  --dots:color-mix(in oklab,var(--shell) 55%,#eef3f8);
  --paper:#fbfcfe;
  --ink:#1b2030;
  --muted:#596077;
  --line:color-mix(in oklab,var(--shell) 22%,#d9dee8);
  --accent:color-mix(in oklab,var(--shell) 72%,#10141f);
  --bezel:#20232f;
  --key:#fbfcfe;
  --ok:#2e8b57; --warn:#c77a12; --bad:#c43b3b;
  --display:"Fredoka","Lexend",system-ui,-apple-system,"Segoe UI",sans-serif;
  --lcd:"VT323","Courier New",monospace;
  --body:"Lexend",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;font-family:var(--body);color:var(--ink);background-color:var(--ground);
  background-image:radial-gradient(var(--dots) 1.3px,transparent 1.7px);background-size:11px 11px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 40px;
  transition:background-color .5s}
.stage{display:grid;grid-template-columns:minmax(0,420px) minmax(0,600px);gap:40px;justify-content:center;align-items:start;max-width:1080px;margin:0 auto}
@media (max-width:900px){.stage{grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:20px}}
@media (max-width:640px){.stage{grid-template-columns:minmax(0,440px);gap:18px}}
@media (orientation:landscape) and (max-height:520px){.stage{grid-template-columns:minmax(0,min(250px,calc((100dvh - 30px)/1.68))) minmax(0,1fr);gap:16px}.brand{width:58%;margin:-22px auto 2px}.device{position:sticky;top:max(8px,env(safe-area-inset-top,0px))}body{padding-block:10px 24px}}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}

/* Coque */
.device{container-type:inline-size;position:relative;width:100%;padding:62px 10% 36px;background:
   radial-gradient(60% 34% at 32% 12%,color-mix(in oklab,#fff 55%,transparent),transparent 70%),
   radial-gradient(90% 60% at 70% 96%,var(--shell-lo),transparent 75%),
   var(--shell);
  border-radius:50% 50% 40% 40%/34% 34% 20% 20%;
  box-shadow:inset 0 -8px 0 color-mix(in oklab,var(--shell-lo) 70%,transparent),inset 0 4px 0 var(--shell-hi),0 16px 0 -6px color-mix(in oklab,var(--shell-lo) 80%,#10141f),0 26px 30px -14px color-mix(in oklab,var(--shell-lo) 70%,transparent);
  transition:background-color .5s}
.ring{position:absolute;top:-14px;left:50%;width:38px;height:30px;margin-left:-19px;border:6px solid var(--shell-lo);border-radius:50%;z-index:-1}
.brand{margin:-30px auto 4px;text-align:center;font:700 22px/1 var(--display);line-height:0;width:84%;max-width:330px;position:relative;z-index:2}.brand img{display:block;width:100%;height:auto;filter:drop-shadow(0 3px 0 rgba(16,20,31,.28))}
.bezel{background:var(--bezel);padding:10px 10px 12px;border-radius:14px 14px 22px 22px;box-shadow:inset 0 2px 0 #3a3e50,0 2px 0 var(--shell-hi)}
.lcd{container:lcd/inline-size;position:relative;aspect-ratio:160/144;width:100%;overflow:hidden;background:#111;border-radius:3px}
#lcd{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;image-rendering:pixelated;touch-action:none;cursor:pointer}
.msg{position:absolute;left:4px;right:4px;bottom:4px;background:#f8f8f0;color:#181820;border:3px solid #181820;border-radius:4px;box-shadow:inset 0 0 0 1px #8890a8;
  font:18px/1 var(--lcd);padding:4px 7px;min-height:30px;display:flex;align-items:center}
.menu{position:absolute;left:4px;right:4px;bottom:4px;background:#f8f8f0;color:#181820;border:3px solid #181820;border-radius:4px;font:20px/1 var(--lcd);padding:5px;display:grid;gap:3px;grid-template-columns:minmax(0,1fr) minmax(0,1fr);max-height:calc(100% - 8px);overflow:auto}
@container lcd (max-width:300px){.menu{font-size:16px}.menu button{min-height:28px}.msg{font-size:15px}}
@container lcd (max-width:210px){.msg{font-size:12px;min-height:18px;padding:2px 4px;border-width:2px}.menu{font-size:13px;padding:3px;gap:2px}.menu button{min-height:20px;padding:1px 4px}}
.msg{pointer-events:none}
@container (max-width:240px){.key{font-size:0;gap:0}.keys{padding:8px 4px}}
.menu h3{grid-column:1/-1;margin:1px 2px 2px;font:inherit;font-size:18px;color:#3a4058}
.menu button{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:34px;padding:3px 6px;background:#fff;border:2px solid #181820;border-radius:3px;text-align:left;font:inherit;line-height:1}
.menu button:hover,.menu button:focus-visible{background:#ffe08a}
.menu.fight{font-size:17px;gap:2px;padding:3px}.menu.fight h3{font-size:16px;margin:0 2px}.menu.fight button{min-height:26px;padding:2px 5px;white-space:nowrap;overflow:hidden}
.menu button.back{grid-column:1/-1;background:#e6e8ef;text-align:center}

/* Touches */
.keys{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px;margin-top:12px;background:var(--bezel);padding:11px 6px 9px;border-radius:14px 14px 24px 24px}
.key{display:flex;flex-direction:column;align-items:center;gap:5px;background:none;border:0;padding:0;color:#eef0f6;font:500 clamp(8px,3.3cqi,12px)/1 var(--body);min-width:0}
.key span{display:grid;place-items:center;width:clamp(28px,15cqi,48px);height:clamp(28px,15cqi,48px);border-radius:50%;background:var(--key);box-shadow:0 3px 0 var(--shell),inset 0 -3px 0 color-mix(in oklab,var(--key) 78%,#20232f);transition:transform .06s,box-shadow .06s}
.key canvas{width:24px;height:24px;image-rendering:pixelated}
.key #keyBall{width:28px;height:28px}
.idcard{display:block;width:100%;height:auto;border-radius:12px;box-shadow:0 0 0 2px var(--line);image-rendering:pixelated}
.swatches{display:flex;flex-wrap:wrap;gap:7px;align-items:center}.swatch{width:34px;height:34px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 2px var(--line);padding:0}.swatch[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ink)}.custom{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--muted)}.custom input{width:36px;height:30px;padding:0;border:0;background:none}
.crop{margin-top:10px;gap:5px}.crop .btn{min-height:36px;min-width:38px;padding:4px 8px}
.itemhead{display:flex;gap:7px;align-items:center}.itemhead img{width:28px;height:28px;image-rendering:pixelated}
.key:active span{transform:translateY(3px);box-shadow:0 1px 0 var(--shell),inset 0 -2px 0 color-mix(in oklab,var(--key) 78%,#20232f)}
.key[aria-disabled="true"]{opacity:.45;cursor:default}
.key.alert span{background:#ffe08a}
@media (prefers-reduced-motion:no-preference){.key.alert span{animation:nudge 1.2s steps(2) infinite}@keyframes nudge{50%{transform:translateY(-3px)}}}

/* Notice */
.book{background:var(--paper);border-radius:16px;border:3px solid color-mix(in oklab,var(--shell) 30%,#fff);box-shadow:0 2px 0 var(--line),0 18px 30px -22px var(--shell-lo);min-width:0}
.tabs{display:flex;flex-wrap:wrap;gap:6px;padding:12px 12px 10px;border-bottom:3px dashed color-mix(in oklab,var(--tab,var(--line)) 35%,#fff);background:color-mix(in oklab,var(--tab,var(--shell)) 8%,#fff);border-radius:14px 14px 0 0}
.tab{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;background:#fff;border:2px solid color-mix(in oklab,var(--tc,#888) 40%,#fff);border-radius:999px;padding:7px 12px 6px 9px;font:700 15px/1 var(--display);color:color-mix(in oklab,var(--tc,#333) 75%,#000);white-space:nowrap;box-shadow:0 2px 0 color-mix(in oklab,var(--tc,#888) 45%,#fff);transition:transform .08s}
@media (hover:hover){.tab:hover{transform:translateY(-2px)}}
@media (max-width:640px){.tabs{flex-wrap:nowrap;overflow-x:auto;scroll-snap-type:x proximity;scrollbar-width:none;padding:10px 10px 9px}.tabs::-webkit-scrollbar{display:none}.tab{scroll-snap-align:start;font-size:14px;padding:7px 11px 6px 8px}}
button,.lcd{touch-action:manipulation}
.keyimg{width:68%;height:68%;object-fit:contain;image-rendering:pixelated;pointer-events:none}.tabimg{width:22px;height:22px;object-fit:contain;image-rendering:pixelated;background:#fff;border-radius:50%;padding:1px;flex:0 0 auto}.fld{display:grid;gap:4px;font-size:13px;font-weight:600}.fld input{font:inherit;font-weight:500;padding:8px 10px;border:2px solid #d8dce6;border-radius:10px;min-width:0;width:100%;box-sizing:border-box}.grid2{display:grid;align-items:end;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}.row.wrap{flex-wrap:wrap}.band.annonce{border-left:4px solid var(--tab,#e04a6f)}.band.annonce p{margin:0 0 4px}
.band.danger{border-color:#c0283c;box-shadow:0 3px 0 #c0283c;background:#fff1f2}.band.danger b{color:#c0283c}.graves{display:grid;gap:8px}.grave{display:flex;gap:10px;align-items:center;padding:6px 10px;border-radius:12px;background:#f1f2f6}.grave img{width:40px;height:40px;object-fit:contain;image-rendering:pixelated;filter:grayscale(1);opacity:.75}
.tab{position:relative}.tab.dot::after{content:"";position:absolute;top:2px;right:4px;width:11px;height:11px;border-radius:50%;background:#e8334a;border:2px solid #fff}
details.online{border:2px solid color-mix(in oklab,var(--tab,#8a6cf0) 35%,#fff);border-radius:14px;padding:10px 14px;background:#fff}details.online summary{cursor:pointer;font-weight:700;font-family:var(--display);font-size:16px}
.book{position:relative}.acct-chip{position:absolute;top:-14px;right:18px;z-index:3;font:600 12px/1 var(--display);padding:6px 12px;border-radius:999px;border:2px solid #fff;background:#2f9e5b;color:#fff;box-shadow:0 2px 0 rgba(16,20,31,.2);cursor:pointer}.acct-chip[hidden]{display:none}
.tabic{width:16px;height:16px;image-rendering:pixelated}
.tab[aria-selected="true"]{background:var(--tc);border-color:var(--tc);color:#fff;box-shadow:0 3px 0 color-mix(in oklab,var(--tc) 60%,#000)}
.tab:hover{background:color-mix(in oklab,var(--tc,#888) 10%,#fff)}.tab[aria-selected="true"]:hover{background:var(--tc)}
.book .pane h2{color:color-mix(in oklab,var(--tab,var(--ink)) 70%,#14182a)}
.pane{padding:20px}
h2{font:700 25px/1.1 var(--display);margin:0;text-wrap:balance}
h3.sub{display:flex;align-items:center;gap:7px;font:700 17px/1.2 var(--display);color:var(--accent);margin:22px 0 8px}
h3.sub::before{content:"";width:9px;height:9px;background:var(--accent);transform:rotate(45deg);border-radius:2px;flex:none}
p{line-height:1.5;margin:0;max-width:62ch}
.small{font-size:13px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:9px 16px;border-radius:12px;border:2px solid var(--ink);background:#fff;font:500 14px/1.1 var(--body);box-shadow:0 2px 0 var(--ink);text-align:center}
.btn:hover{background:color-mix(in oklab,var(--shell) 16%,#fff)}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn.primary{background:var(--accent);color:#fff}
.btn.primary:hover{background:color-mix(in oklab,var(--accent) 85%,#000)}
.btn.danger{border-color:var(--bad);color:var(--bad);box-shadow:0 2px 0 var(--bad)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.stack{display:grid;gap:14px}
.drop{border:2px dashed var(--line);border-radius:6px;padding:18px}
.head{display:flex;gap:14px;align-items:center}
.portrait{flex:0 0 88px;height:88px;display:grid;place-items:center;background:color-mix(in oklab,var(--shell) 14%,#fff);border-radius:6px}
.portrait img{max-width:80px;max-height:80px;image-rendering:pixelated}
.nick{width:100%;min-width:0;border:0;border-bottom:2px solid var(--line);background:none;padding:2px 0;font:700 25px/1.15 var(--display)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.chip{font:500 12px/1 var(--body);padding:4px 8px;border-radius:99px;color:#fff}
.stats{display:grid;grid-template-columns:auto minmax(0,1fr) 3ch;gap:7px 10px;align-items:center;font-size:14px;font-variant-numeric:tabular-nums}
.bar{height:10px;background:#e6e9f0;border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}
.bar i.mid{background:var(--warn)} .bar i.low{background:var(--bad)}
.stats b{font-weight:500;text-align:right}
.chain{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.chain img{width:48px;height:48px;object-fit:contain;image-rendering:pixelated}
.chain img.un{filter:brightness(0);opacity:.35}
.chain span{color:var(--muted)}
.facts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;font-size:14px;margin:0}
.facts dt{color:var(--muted)} .facts dd{margin:0}
.search{width:100%;min-height:42px;padding:8px 11px;border:2px solid var(--line);border-radius:6px;background:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:5px;max-height:440px;overflow:auto;padding:2px}
.cell{display:grid;justify-items:center;gap:2px;padding:4px 2px;background:#f2f4f8;border:2px solid transparent;border-radius:5px;font-size:11px;line-height:1.15;min-width:0;text-align:center;overflow-wrap:anywhere}
button.cell:hover{border-color:var(--accent)}
.cell img{width:56px;height:56px;object-fit:contain;image-rendering:pixelated}
.cell.un img{filter:brightness(0);opacity:.28}
.cell.un{color:var(--muted)}
.cell.raised{background:color-mix(in oklab,var(--shell) 20%,#fff)}
.card{display:flex;gap:10px;align-items:center;padding:9px;background:#f6f7fb;border:2px solid #e6e9f0;border-radius:12px}
.card img{width:56px;height:56px;object-fit:contain;image-rendering:pixelated;flex:none}
.card>div{min-width:0;flex:1}
.card b{display:block;overflow-wrap:anywhere}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg label{display:block;cursor:pointer}
.seg input{position:absolute;opacity:0}
.seg span{display:block;padding:8px 12px;border:2px solid var(--line);border-radius:6px;font-size:14px}
.seg input:checked+span{border-color:var(--accent);background:color-mix(in oklab,var(--shell) 16%,#fff);font-weight:500}
.seg input:focus-visible+span{outline:3px solid var(--ink);outline-offset:2px}
.check{display:flex;gap:9px;align-items:center;font-size:14px;min-height:30px}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.prog{font-size:13px;color:var(--muted);margin-top:4px}
.money{font:700 20px/1 var(--display);color:var(--accent)}
.band.err{background:#fde6e4;color:#8a2a22}
.item.lock{opacity:.5}.item.got{background:color-mix(in oklab,var(--shell) 16%,#fff)}
.shop{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}.shop .item{grid-template-columns:1fr auto;align-items:center}.shop .item .btn{justify-self:end}.shop .item .itemhead{min-width:0}.shop .item b{overflow-wrap:anywhere;font-size:14px}.shop .item .small{text-align:right}
.btn[disabled]{opacity:.45;cursor:default;box-shadow:none}
.sw{display:inline-block;width:22px;height:22px;border-radius:4px;border:1px solid var(--line)}
.decor{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}.decor label{display:grid;gap:4px}
textarea{width:100%;min-height:70px;padding:8px;border:2px solid var(--line);border-radius:6px;font:12px/1.35 ui-monospace,Menlo,Consolas,monospace;background:#fff;resize:vertical;word-break:break-all}
.code{width:100%;min-height:46px;padding:8px 12px;border:2px solid var(--line);border-radius:12px;background:#fff;font:24px/1 var(--lcd);letter-spacing:.08em;text-transform:uppercase}
.band{position:relative;padding:9px 13px;border-radius:12px;background:#fff;border:2px solid var(--ink);box-shadow:0 3px 0 var(--ink);font-size:14px;line-height:1.45}
.band b{font-family:var(--display);font-size:15px;color:var(--accent)}
.cal{display:grid;gap:7px}.calrow{display:grid;grid-template-columns:150px 1fr;gap:2px 12px;padding:9px 11px;border:2px solid #e6e9f0;border-radius:12px;background:#f6f7fb}.calrow .small{grid-column:2}.caldate{font:20px/1 var(--lcd);color:var(--accent);grid-row:span 2}
@media (max-width:520px){.calrow{grid-template-columns:1fr}.calrow .small{grid-column:1}.caldate{grid-row:auto}}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:6px}
.item{display:grid;gap:4px;padding:9px;background:#f6f7fb;border:2px solid #e6e9f0;border-radius:12px;align-content:start}
.item .btn{justify-self:start;min-height:34px;padding:5px 10px}
.badge{flex:none;width:30px;height:30px;transform:rotate(45deg);margin:6px 8px;border-radius:4px}
.card.locked{opacity:.55}
.card .row{flex:none}
.card .btn{min-height:36px;padding:6px 10px}
.card .small{display:block}
.logs{display:grid;gap:9px;max-height:520px;overflow:auto}
.logline{display:grid;gap:1px;border-bottom:1px solid var(--line);padding-bottom:8px}
select{min-height:42px;padding:7px;border:2px solid var(--line);border-radius:6px;background:#fff;max-width:100%}
@media (max-width:520px){.card{flex-wrap:wrap}.card .row{flex:1 1 100%}}
</style>

<main class="stage">

function parsePokeLabel(s){
  const grab=k=>{const m=s.match(new RegExp('const\\s+'+k+'\\s*=\\s*(\\[[\\s\\S]*?\\]);'));if(!m)return null;try{return JSON.parse(m[1])}catch(e){return null}};
  const names=grab('NAMES');let imgs=grab('_UI');if(!imgs||!imgs.length)imgs=grab('_BW');
  if(!names||!imgs||!imgs.length)return null;
  const n=Math.min(names.length,imgs.length,DEX.length);return{names:names.slice(0,n),imgs:imgs.slice(0,n)};
}

function sprite(id,sh){

  const o=CACHE[key]={ready:false},img=new Image(),src=SPR.imgs[id-1],web=src.startsWith('http');
  if(web)img.crossOrigin='anonymous';
  img.onerror=()=>setTimeout(()=>{delete CACHE[key]},5000);
  img.onload=()=>{const W=img.naturalWidth,H=img.naturalHeight,c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d',{willReadFrequently:true});g.drawImage(img,0,0);
    if(sh&&!web){const q=g.getImageData(0,0,W,H),d=q.data;for(let i=0;i<d.length;i+=4){const r=d[i];d[i]=d[i+2];d[i+2]=d[i+1];d[i+1]=r}g.putImageData(q,0,0)}
    const a=g.getImageData(0,0,W,H).data;let x0=W,y0=H,x1=-1,y1=-1;for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(a[(y*W+x)*4+3]>16){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}
    if(x1<0){x0=y0=0;x1=W-1;y1=H-1}
    const w=x1-x0+1,h=y1-y0+1,mk=col=>{const k=document.createElement('canvas');k.width=w;k.height=h;const q=k.getContext('2d');q.drawImage(c,x0,y0,w,h,0,0,w,h);if(col){q.globalCompositeOperation='source-in';q.fillStyle=col;q.fillRect(0,0,w,h)}return k};
    let hs=0,hn=0;for(let y=y0;y<Math.min(y0+6,y1+1);y++)for(let x=x0;x<=x1;x++)if(a[(y*W+x)*4+3]>16){hs+=x-x0;hn++}o.hx=hn?hs/hn:w/2;o.c=mk();o.white=mk('#fff');o.black=mk('#14162a');o.w=w;o.h=h;o.s=Math.max(w,h)<=32?2:1;o.ready=true};

const isNight=ts=>{const h=new Date(ts).getHours();return h>=21||h<7};
const clamp=v=>Math.max(0,Math.min(100,v));
function step(p,ms,ts,sum){
  const h=ms/36e5*PACE[S.opt.pace];
  if(p.ko||p.away)return;
  const night=S.opt.night&&isNight(ts);
  if(night&&!p.asleep&&ts>(p.awakeUntil||0)){p.asleep=true;p.sleepBy='night'}
  if(p.asleep&&((p.sleepBy==='night'&&!night)||(p.sleepBy==='user'&&p.energy>=100))){p.asleep=false}
  const f=p.asleep?.25:1;
  p.hunger=clamp(p.hunger-(p.nature==='gourmand'?10:8)*h*f);p.joy=clamp(p.joy-(p.sick?9:5)*h*f);
  p.energy=clamp(p.energy+(p.asleep?16*h:-(p.nature==='flemmard'?7:5)*h));p.clean=clamp(p.clean-(4+p.poops*2)*h*f);
  p.poopD+=.33*h*f;if(p.poopD>=1){p.poopD-=1;if(p.poops<4){p.poops++;if(sum)sum.poops=(sum.poops||0)+1}}
  p.sickD=(p.clean<25||p.hunger<15)?p.sickD+h:Math.max(0,p.sickD-h);
  if(p.sickD>=4&&!p.sick){p.sick=true;p.sickD=0;if(sum)sum.sick=1}
  p.neg=p.hunger<=0?p.neg+h:Math.max(0,p.neg-h*2);
  if(p.neg>=24){p.ko=true;p.asleep=false;if(sum)sum.ko=1}
  if(!p.sick&&p.hunger>=50&&p.joy>=50&&p.energy>=50&&p.clean>=50)p.bond=Math.min(100,p.bond+1.5*h);
  p.ageH+=h;
}
function advance(p,to,sum){
  if(!p||p.stage==='egg'){if(p)p.lastTick=to;return}
  let t=Math.max(p.lastTick,to-14*864e5),s=3e5;
  while(to-t>0){const d=Math.min(s,to-t);t+=d;step(p,d,t,sum)}
  p.lastTick=to;
}

  if(p.hunger<30)return{t:`${petName(p)} a faim.`,ic:'berry',c:'#e0483c',k:'kFeed'};

function earn(n,rep){n=Math.round(n||0);if(n<=0)return 0;if(rep){const d=today();if(S.capDay!==d){S.capDay=d;S.capGot=0}n=Math.min(n,Math.max(0,CFG.cap-(S.capGot||0)));S.capGot=(S.capGot||0)+n}if(!n)return 0;S.money=(S.money||0)+n;S.st.money=st('money')+n;touch();return n}

  const rows=ONL.list.map(p=>{const t=p.team[0]||{},st=fr.has(p.uid)?'<span class="small">Déjà ami</span>':sent.has(p.uid)?'<span class="small">Demande envoyée</span>':inb.has(p.uid)?'<span class="small">T\'a envoyé une demande</span>':`<button class="btn" type="button" data-onl="${esc(p.tag)}">Ajouter</button>`;
    return `<div class="card"><img alt="" src="${webSrc(Math.max(1,Math.min(493,t.i|0||1)),!!t.s)}"><div><b>${esc(String(p.name||'?').slice(0,16))}</b><span class="small">${(p.team||[]).map(x=>esc(nameOf(Math.max(1,Math.min(493,x.i|0||1))))+' n.'+(x.l|0)).join(', ')} · ${p.b|0} badge${(p.b|0)>1?'s':''}</span></div><div class="row">${st}</div></div>`}).join('');
  return `<details class="online" ${ONL.open?'open':''}><summary>Joueurs en ligne${ONL.at?` (${ONL.list.length})`:''}</summary>
  <div class="stack" style="margin-top:8px">${ONL.loading?'<p class="small">Chargement…</p>':ONL.err?`<p class="small">${esc(ONL.err)}</p>`:ONL.at&&!rows?`<p class="small">Personne d'autre n'a joué ces ${ONLINE_MIN} dernières minutes.</p>`:rows}
  <div class="row"><button class="btn" type="button" data-onl-r="1">Actualiser la liste</button></div>
  <label class="check"><input type="checkbox" id="onlListed" ${listed()?'checked':''}>Apparaître dans cette liste pour les autres joueurs</label></div></details>`}
{const _nb=netBand;netBand=function(){const h=_nb();if(NET.st!=='ok')return h;const i=h.lastIndexOf('</div>');return i>0?h.slice(0,i)+onlineBox()+h.slice(i):h+onlineBox()}}
$('pane').addEventListener('toggle',e=>{if(!e.target.matches||!e.target.matches('details.online'))return;ONL.open=e.target.open;if(ONL.open&&(!ONL.at||Date.now()-ONL.at>60e3))onlineLoad()},true);
$('pane').addEventListener('click',e=>{const a=e.target.closest('[data-onl]');if(a){const t=a.dataset.onl;a.disabled=true;netAct(()=>netAdd(t),'Demande envoyée. Ton ami doit l\'accepter.');return}
  if(e.target.closest('[data-onl-r]'))onlineLoad()});
$('pane').addEventListener('change',e=>{if(e.target.id!=='onlListed')return;S.opt.listed=e.target.checked;touch();save(true);netPublish(true).catch(()=>{});flash(S.opt.listed?'Tu apparais dans la liste des joueurs en ligne.':'Tu n\'apparais plus dans la liste.')});
/* Présence : signale toutes les 3 minutes que le joueur est là (si la page est visible) */
if(netCan())setInterval(()=>{if(NET.st==='ok'&&!document.hidden&&listed())netPublish(true).catch(()=>{})},3*60e3);
addEventListener('visibilitychange',()=>{if(!document.hidden&&NET.st==='ok'&&listed())netPublish(true).catch(()=>{})});


/* Pastille « Connecté : PSEUDO » visible sur tous les onglets */
{const bk=document.querySelector('.book');if(bk&&!$('acctChip')){const c=document.createElement('button');c.id='acctChip';c.type='button';c.className='acct-chip';c.hidden=true;c.onclick=()=>{tab='options';renderPane()};bk.prepend(c)}}
function acctChip(){const c=$('acctChip');if(!c)return;const on=typeof isAcct==='function'&&isAcct();c.hidden=!on;if(on)c.textContent='Connecté : '+pseudoOf(fbUser())}
{const _rp=renderPane;renderPane=function(){_rp();acctChip()}}

/* ---------- Démarrage et boucles ---------- */
function boot(){
  const l=readLocal();if(l)S=l;migrate();
  paint();autoLoad().then(()=>{loadTried=true;if(!SPR)paint()});connectCloud();
  setInterval(render,33);fetchWeather();setInterval(fetchWeather,30*6e4);
  setInterval(()=>{if(S.pet&&S.pet.stage!=='egg'&&mode!=='evo')advance(S.pet,Date.now());lifeTick();refreshMsg();touch()},1000);
  setInterval(()=>{const a=document.activeElement;if(tab==='fiche'&&SPR&&S.pet&&!picking&&$('stats')&&S.pet.stage!=='egg')$('stats').innerHTML=statRows(S.pet)},2000);
  setInterval(()=>save(false),5000);setInterval(()=>save(true),60000);
  document.addEventListener('visibilitychange',()=>{if(document.hidden)save(true);else{catchUp();paint()}});
  addEventListener('pagehide',()=>save(false));
}
boot();
</script>
